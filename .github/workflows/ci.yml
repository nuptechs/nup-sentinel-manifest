name: CI

# ADR-0014 D8d — sem CI, os 276 testes só rodavam se alguém rodasse local.
# Gate: instala e roda a suíte (tsx --test, sem build/JVM). O typecheck
# (`npm run check`) NÃO entra no gate por ter erros pré-existentes de
# tipos em módulos legados; adicionar quando forem zerados.
#
# Usa `npm install` (não `npm ci`): o package-lock tem um drift pré-existente
# com bufferutil@4.1.0 (optional native addon do `ws`) que npm 10/11 tratam
# de forma diferente — `npm ci` estrito falha no runner. `npm install` é
# resiliente a isso e não commita o lock (CI é efêmero). Trocar por `npm ci`
# quando o lock for regenerado com a mesma major do runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      # Os 82 testes de componente do client (vitest + jsdom, telas do Mapa do
      # Sistema) não eram gate — regressão de tela mergeava com CI verde.
      # Verificado 82/82 verde antes de virar gate (2026-08-08). Nota: o
      # recharts emite stderr "width(0) and height(0)" em jsdom (container sem
      # dimensão) — é ruído esperado, não falha teste.
      - name: Test client (vitest)
        run: npm run test:client
      # Guarda anti-drift de documentação: as docs autoritativas ancoram
      # afirmações por SÍMBOLO (`arquivo:Símbolo`); este gate falha se uma
      # âncora deixar de existir no código (doc e código divergiram). Zero
      # dependência, determinístico (Node 20 já instalado acima).
      - name: Verify docs (doc-verify)
        run: node scripts/doc-verify.mjs --root . --marked

  # ADR-0023 O5 — o engine Java consolidado (dual-entrypoint HTTP+CLI) ganha
  # gate próprio: antes o código Java só era validado dentro do docker build
  # (com -DskipTests) — zero rede de segurança em PR. Roda a suíte JUnit
  # (inclui o teste de PARIDADE byte-a-byte do contrato do modo extract) e o
  # package (shade) completo.
  java-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test + package
        run: mvn -q -f java-analyzer-engine/pom.xml clean package
